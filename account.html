<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساحتي — حبر وبكسل</title><link rel="stylesheet" href="public.css?v=43"></head><body><div class="site"><header class="site nav"><a class="logo" href="index.html">حبر وبكسل<i></i></a><nav class="navlinks"><a href="index.html">الرئيسية</a><a href="services.html">الخدمات</a><a href="portfolio.html">الأعمال</a><a href="contact.html">تواصل</a></nav><div class="nav-actions"><a class="outline-btn" data-client-link href="login.html?next=account">دخول العميل</a><a class="solid-btn" href="order.html">ابدأ مشروعك</a><button class="menu" aria-label="القائمة">☰</button></div></header></div>
<main><section class="section" style="padding-top:55px"><div class="site account-shell"><div class="kicker">CLIENT SPACE / 43</div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><h1 id="hello" style="font:800 clamp(2.4rem,6vw,4.5rem)/1.05 var(--display);letter-spacing:-.06em;margin:0">مساحتك</h1><p id="intro" class="intro" style="margin-top:12px">كل مشاريعك وطلباتك بمكان واحد.</p></div><button id="logout" class="outline-btn">تسجيل خروج</button></div>
<div id="error" class="message" style="margin-top:18px"></div>
<section style="margin-top:35px"><div class="kicker">PROJECTS</div><div id="projects" class="account-grid" style="margin-top:14px">جاري تحميل مشاريعك…</div></section>
<section style="margin-top:42px"><div class="kicker">ORDERS</div><div id="count" style="font-weight:800;font-size:1.15rem;margin-top:8px">—</div><div id="orders" style="margin-top:14px">جاري التحميل…</div></section>
<a class="solid-btn" style="display:inline-block;margin-top:28px" href="order.html">طلب مشروع جديد ←</a></div></section></main>
<script src="public.js?v=43"></script><script>(async()=>{const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const labels={planned:'مخطط',active:'قيد التنفيذ',review:'مراجعة',completed:'مكتمل',paused:'متوقف',new:'جديد',reviewing:'قيد المراجعة',quoted:'تم إرسال عرض',approved:'تمت الموافقة',in_progress:'قيد التنفيذ',cancelled:'ملغي'};const money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';function card(p){const pct=p.amount?Math.min(100,Math.round((Number(p.paid||0)/Number(p.amount))*100)):0;return `<article class="account-box" style="margin:0"><div style="display:flex;justify-content:space-between;gap:15px"><div><div class="kicker">PROJECT</div><h2 style="margin:5px 0 0;font-size:1.25rem">${esc(p.name)}</h2></div><span class="pill">${esc(labels[p.status]||p.status||'—')}</span></div><div style="margin-top:20px"><div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)"><span>التحصيل</span><b>${pct}%</b></div><div style="height:7px;background:rgba(31,95,168,.1);border-radius:99px;overflow:hidden;margin-top:7px"><span style="display:block;width:${pct}%;height:100%;background:var(--blue);border-radius:99px"></span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;font-size:.82rem"><div><small style="color:var(--muted)">المدفوع</small><strong style="display:block">${money(p.paid)}</strong></div><div><small style="color:var(--muted)">المتبقي</small><strong style="display:block">${money(p.remaining)}</strong></div></div>${p.tasks?.length?`<div style="margin-top:18px;border-top:1px solid rgba(30,41,59,.08);padding-top:14px"><small style="color:var(--muted)">${p.tasks.length} مهام</small></div>`:''}${p.deliveries?.length?`<div style="margin-top:8px"><small style="color:var(--muted)">${p.deliveries.length} تسليمات</small></div>`:''}</article>`}try{const me=await fetch('/.netlify/functions/client-auth?action=me',{credentials:'include',cache:'no-store'});const md=await me.json();if(!md.authenticated){location.href='login.html?next=account';return}$('hello').textContent='هلا '+md.client.name+' 👋';$('intro').textContent=md.client.email+' · '+md.client.whatsapp;const pr=await fetch('/.netlify/functions/client',{credentials:'include',cache:'no-store'});const d=await pr.json();if(!pr.ok)throw Error(d.error||'تعذر تحميل المساحة');$('projects').innerHTML=d.projects?.length?d.projects.map(card).join(''):'<div class="account-box"><p style="color:var(--muted);margin:0">ماكو مشاريع مفعّلة بعد. أول خطوة تبدأ من طلب مشروع جديد.</p></div>';const or=await fetch('/.netlify/functions/orders',{credentials:'include',cache:'no-store'}),j=await or.json();if(!or.ok)throw Error(j.error||'تعذر تحميل الطلبات');const list=j.orders||[];$('count').textContent=list.length+' طلب';$('orders').innerHTML=list.length?list.map(o=>`<div class="order-item"><span class="pill">${esc(labels[o.status]||o.status)}</span><strong style="display:block;margin-top:6px">${esc(o.service)}</strong><div style="color:var(--muted);font-size:.78rem">${new Date(o.createdAt).toLocaleString('ar-IQ')}</div><p style="color:var(--muted);font-size:.86rem">${esc(o.details||'').slice(0,220)}</p></div>`).join(''):'<p style="color:var(--muted)">ما عندك طلبات بعد.</p>'}catch(e){$('error').textContent=e.message||'تعذر تحميل المساحة.';$('error').style.color='#b65757'}})();document.getElementById('logout').onclick=async()=>{await fetch('/.netlify/functions/client-auth?action=logout',{method:'POST',credentials:'include'});location.href='index.html'};</script></body></html>
