<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلب مشروع — حبر وبكسل</title><link rel="stylesheet" href="public.css?v=43"></head><body><div class="site"><header class="nav"><a class="logo" href="index.html">حبر وبكسل<i></i></a><nav class="navlinks"><a href="index.html">الرئيسية</a><a href="services.html">الخدمات</a><a href="portfolio.html">الأعمال</a><a href="contact.html">تواصل</a></nav><div class="nav-actions"><a class="outline-btn" data-client-link href="login.html?next=account">دخول العميل</a><a class="solid-btn" href="onboarding.html">ابدأ مشروعك</a><button class="menu" aria-label="القائمة">☰</button></div></header></div><main><section class="site intake"><div class="intake-head"><div><div class="kicker">CLIENT SPACE / NEW PROJECT</div><h1 class="intake-title">شنو نبني<br><em>سوا؟</em></h1></div><p class="intake-lead">هذا الطلب يدخل مباشرة إلى حسابك وإلى نظام التشغيل عندنا، حتى يبقى المشروع مرتبطاً بتاريخك وملفاتك.</p></div><form id="orderForm" class="intake-form" novalidate><div class="intake-row"><label class="intake-label" for="service">الخدمة</label><select class="intake-control" id="service"><option>هوية وحضور بصري</option><option>محتوى وتصميم</option><option>تجربة رقمية</option><option>استراتيجية ونمو</option></select></div><div class="intake-row"><label class="intake-label" for="budget">الميزانية التقريبية</label><input class="intake-control" id="budget" placeholder="مثلاً: 1,000,000 د.ع"></div><div class="intake-row"><label class="intake-label" for="timeline">المدة المطلوبة</label><input class="intake-control" id="timeline" placeholder="مثلاً: 3 أسابيع"></div><div class="intake-row"><label class="intake-label" for="details">تفاصيل المشروع</label><textarea class="intake-control intake-textarea" id="details" required placeholder="الهدف، الجمهور، المطلوب، الروابط إن وجدت..."></textarea></div><div class="intake-actions"><button class="solid-btn" type="submit">إرسال الطلب ←</button></div><div id="msg" class="status" aria-live="polite"></div></form></section></main><div class="site footer"><span>حبر وبكسل — Client Space</span><span>كل مشروع يبقى مرتبطاً بذاكرته.</span></div><script src="public.js?v=43"></script><script>(async function(){const me=await fetch('/.netlify/functions/client-auth?action=me',{credentials:'include',cache:'no-store'}).then(r=>r.json()).catch(()=>({}));if(!me.authenticated){location.replace('login.html?next=order');return}const form=document.getElementById('orderForm');form.addEventListener('submit',async function(e){e.preventDefault();const msg=document.getElementById('msg'),btn=form.querySelector('button[type="submit"]');btn.disabled=true;msg.textContent='جارٍ إرسال الطلب…';try{const r=await fetch('/.netlify/functions/orders',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:document.getElementById('service').value,budget:document.getElementById('budget').value,timeline:document.getElementById('timeline').value,details:document.getElementById('details').value.trim()})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر إرسال الطلب');msg.style.color='#3f8a63';msg.textContent='تم استلام طلبك ✓';form.reset()}catch(err){msg.style.color='#b65757';msg.textContent=err.message||'تعذر إرسال الطلب.'}finally{btn.disabled=false}})})();</script></body></html>
