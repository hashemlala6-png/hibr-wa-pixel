name: Project safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/instagram-login-no-facebook-page]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run regression tests
        run: HBPX_BLOBS_CONTEXT=production npm test
      - name: Verify deploy-context-specific Blobs stores
        shell: bash
        run: |
          CONTEXT=deploy-preview BRANCH=checks-preview npm run build
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { deploymentScope, scopedStoreName } = require('./netlify/functions/blob-config');
          assert.deepEqual(deploymentScope(), { context: 'deploy-preview', branch: 'checks-preview' });
          assert.notEqual(
            scopedStoreName('hbpx-leads', { context: 'deploy-preview', branch: 'checks-preview' }),
            scopedStoreName('hbpx-leads', { context: 'deploy-preview', branch: 'another-preview' })
          );
          NODE
          CONTEXT=production BRANCH=main npm run build
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { deploymentScope, scopedStoreName } = require('./netlify/functions/blob-config');
          assert.deepEqual(deploymentScope(), { context: 'production', branch: 'main' });
          assert.equal(scopedStoreName('hbpx-leads'), 'hbpx-leads');
          NODE
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find netlify/functions tests scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check root JavaScript files
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Check inline JavaScript in HTML pages
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('.').filter(name => name.endsWith('.html'));
          let failed = false;
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => {
              if (!match[1].trim()) return;
              try { new Function(match[1]); }
              catch (error) {
                failed = true;
                console.error(file + ' inline script #' + (index + 1) + ': ' + error.message);
              }
            });
          }
          if (failed) process.exit(1);
          console.log('Inline JavaScript syntax passed for ' + files.length + ' HTML pages.');
          NODE
