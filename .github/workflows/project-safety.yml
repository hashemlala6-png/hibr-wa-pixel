name: Project safety checks

on:
  pull_request:
    branches: [main]
  push:
  branches: [main, feature/instagram-login-no-facebook-page]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run regression tests
        run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find netlify/functions tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
