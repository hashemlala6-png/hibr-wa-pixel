<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مهام المدير التنفيذي | حبر وبكسل</title>
<style>
body{margin:0;background:#f4f7fa;color:#192a36;font-family:system-ui,Arial,sans-serif}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe7ec;border-radius:15px;padding:16px;margin:12px 0}button{font:inherit;padding:10px 14px;border:1px solid #dfe7ec;border-radius:9px;background:white;cursor:pointer}.primary{background:#1f5fa8;color:white;border-color:#1f5fa8}input,select{display:block;width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #ccd7df;border-radius:9px;font:inherit}.muted{color:#647581;line-height:1.8}.item{border:1px solid #e1e8ed;border-radius:10px;padding:12px;margin:9px 0}.hidden{display:none!important}
</style></head><body><main class="wrap">
<header><p class="muted">HIBR & PIXEL · OWNER ONLY</p><h1>تحويل توصيات المدير التنفيذي إلى مهام</h1><p class="muted">هذه الصفحة تحفظ مهاماً داخلية فقط. لا ترسل رسائل ولا تنشر محتوى ولا تصرف أموالاً.</p><button id="back">العودة إلى عقل المدير التنفيذي</button></header>
<section id="login" class="card hidden"><h2>دخول المالك</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور المالك" required><button class="primary">دخول</button></form><p id="loginError" class="muted"></p></section>
<div id="app" class="hidden"><section class="card"><h2>توصيات التقرير الأخير</h2><p id="briefStatus" class="muted">جارٍ تحميل التقرير…</p><div id="priorities"></div></section>
<section class="card"><h2>إنشاء مهمة داخلية</h2><form id="taskForm"><label for="title">عنوان المهمة</label><input id="title" maxlength="200" required><label for="project">المشروع المرتبط</label><select id="project" required><option value="">جارٍ تحميل المشاريع…</option></select><label for="assignee">المسؤول (اختياري)</label><input id="assignee" maxlength="100" placeholder="مثال: فريق المحتوى"><label for="dueDate">الموعد النهائي (اختياري)</label><input id="dueDate" type="date"><button class="primary" id="save">حفظ المهمة</button></form><p id="taskStatus" class="muted"></p></section>
<section class="card"><h2>المهام الحالية</h2><button id="refresh">تحديث المهام</button><div id="tasks"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch('/.netlify/functions/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'تعذر الاتصال');return d}
function show(ok){$('login').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok)}
$('back').onclick=()=>location.href='/ceo-brain.html';
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('auth?action=login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';show(true);await load()}catch(x){$('loginError').textContent=x.message}};
async function load(){try{const d=await api('ceo-briefing');const s=d.latest?.source||{},r=d.latest?.report||{};const p=s.projects||[];$('project').innerHTML='<option value="">اختاري المشروع</option>'+p.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' · '+esc(x.status||'بدون حالة')+'</option>').join('');if(!p.length)$('project').innerHTML='<option value="">لا توجد مشاريع مسجلة في التقرير</option>';$('briefStatus').textContent=d.latest?'آخر تقرير: '+new Date(d.latest.createdAt).toLocaleString('ar-IQ'):'لا يوجد تقرير محفوظ بعد. أنشئي تقريراً من صفحة عقل المدير التنفيذي أولاً.';const arr=Array.isArray(r.priorities)?r.priorities:[];$('priorities').innerHTML=arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.title)+'</b><p>'+esc(x.nextStep||x.why||'')+'</p><button type="button" onclick="usePriority('+i+')">حوّلها إلى مهمة</button></div>').join(''):'لا توجد توصيات متاحة.';window._priorities=arr;await tasks()}catch(e){$('briefStatus').textContent='تعذر تحميل التقرير: '+e.message}}
window.usePriority=i=>{const p=(window._priorities||[])[i];if(p){$('title').value=(p.priority?'['+p.priority+'] ':'')+p.title;$('taskStatus').textContent='اختاري المشروع ثم احفظي المهمة.';$('title').focus()}};
async function tasks(){try{const d=await api('operations');const arr=d.tasks||[];$('tasks').innerHTML=arr.length?arr.slice(0,30).map(t=>'<div class="item"><b>'+esc(t.title)+'</b><p class="muted">الحالة: '+esc(({todo:'قيد الانتظار',doing:'قيد التنفيذ',review:'قيد المراجعة',done:'مكتملة'}[t.status]||t.status))+' · المسؤول: '+esc(t.assignee||'غير محدد')+' · الموعد: '+esc(t.dueDate||'غير محدد')+'</p></div>').join(''):'لا توجد مهام مسجلة بعد.'}catch(e){$('tasks').textContent='تعذر تحميل المهام: '+e.message}}
$('taskForm').onsubmit=async e=>{e.preventDefault();const b=$('save');b.disabled=true;$('taskStatus').textContent='جارٍ الحفظ…';try{const d=await api('operations',{method:'POST',body:JSON.stringify({type:'task',projectId:$('project').value,title:$('title').value,assignee:$('assignee').value,dueDate:$('dueDate').value})});$('taskStatus').textContent='تم حفظ المهمة داخلياً: '+d.item.title;$('title').value='';await tasks()}catch(x){$('taskStatus').textContent='لم تُحفظ المهمة: '+x.message}finally{b.disabled=false}};
$('refresh').onclick=tasks;
async function check(){try{const d=await api('auth?action=me');show(!!d.authenticated);if(d.authenticated)await load()}catch{show(false)}}check();
</script></body></html>
