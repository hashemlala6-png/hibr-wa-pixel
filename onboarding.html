<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ابدأ مشروعك مع حبر وبكسل."><title>ابدأ مشروعك — حبر وبكسل</title><link rel="stylesheet" href="public.css?v=43"></head><body><div class="site"><header class="nav"><a class="logo" href="index.html">حبر وبكسل<i></i></a><nav class="navlinks"><a href="index.html">الرئيسية</a><a href="services.html">الخدمات</a><a href="portfolio.html">الأعمال</a><a href="contact.html">تواصل</a></nav><div class="nav-actions"><button class="menu" aria-label="القائمة">☰</button></div></header></div><main><section class="site intake"><div class="intake-head"><div><div class="kicker">START A PROJECT / 01</div><h1 class="intake-title">خلينا نعرف<br>وين تريد <em>توصل.</em></h1></div><p class="intake-lead">هذه مو استمارة طويلة. نحتاج الأساسيات فقط حتى نفهم نقطة البداية ونرجع لك بخطوة واضحة.</p></div><form id="startForm" name="project-intake" method="POST" data-netlify="true" class="intake-form" novalidate><input type="hidden" name="form-name" value="project-intake"><input type="hidden" name="bot-field" value="" aria-hidden="true"><div class="intake-row"><label class="intake-label" for="name">الاسم / الشركة</label><input class="intake-control" id="name" name="name" autocomplete="name" required placeholder="اسمك أو اسم المشروع"></div><div class="intake-row"><label class="intake-label" for="whatsapp">واتساب</label><input class="intake-control" id="whatsapp" name="whatsapp" inputmode="tel" autocomplete="tel" required placeholder="077xxxxxxxx"></div><div class="intake-row"><label class="intake-label" for="email">البريد الإلكتروني</label><input class="intake-control" id="email" name="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="intake-row"><label class="intake-label" for="service">الخدمة</label><select class="intake-control" id="service" name="service"><option>هوية وحضور بصري</option><option>محتوى وتصميم</option><option>تجربة رقمية</option><option>استراتيجية ونمو</option></select></div><div class="intake-row"><label class="intake-label" for="budget">الميزانية التقريبية</label><select class="intake-control" id="budget" name="budget"><option>أحتاج توجيه</option><option>أقل من 500 ألف</option><option>500 ألف – 1 مليون</option><option>1 – 3 مليون</option><option>أكثر من 3 مليون</option></select></div><div class="intake-row"><label class="intake-label" for="details">شنو تريد يتحسن؟</label><textarea class="intake-control intake-textarea" id="details" name="details" required placeholder="المشكلة، الهدف، الجمهور، أو الشيء اللي تريد يتغير..."></textarea></div><div class="intake-actions"><button class="solid-btn" type="submit">أرسل البداية ←</button><button class="outline-btn wa-outline" type="button" data-wa>واتساب مباشر</button></div><div id="msg" class="status" aria-live="polite"></div><p class="intake-note">إذا ما تعرف أي خدمة تناسبك، اختار «أحتاج توجيه» واحچي لنا عن الهدف.</p></form></section></main><div class="site footer"><span>حبر وبكسل — Digital Studio</span><span>فكرة أوضح. حضور يشتغل.</span></div><script src="public.js?v=43"></script><script>(function(){const q=new URLSearchParams(location.search),map={identity:'هوية وحضور بصري',content:'محتوى وتصميم',digital:'تجربة رقمية',growth:'استراتيجية ونمو'},sel=document.getElementById('service');if(map[q.get('service')])sel.value=map[q.get('service')];window.hwp?.trackFunnel('onboarding_start');document.getElementById('startForm').addEventListener('submit',async function(e){e.preventDefault();const msg=document.getElementById('msg'),btn=this.querySelector('button[type="submit"]');const payload={name:document.getElementById('name').value.trim(),whatsapp:document.getElementById('whatsapp').value.trim(),email:document.getElementById('email').value.trim(),service:sel.value,budget:document.getElementById('budget').value,details:document.getElementById('details').value.trim(),source:'public-onboarding'};msg.textContent='جارٍ إرسال البداية…';btn.disabled=true;try{const r=await fetch('/.netlify/functions/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر الإرسال');msg.style.color='#3f8a63';msg.textContent='تم استلام البداية ✓ راح نتواصل وياك قريباً.';window.hwp?.trackFunnel('quote_request');this.reset()}catch(err){msg.style.color='#b65757';msg.textContent=err.message||'تعذر إرسال الطلب.'}finally{btn.disabled=false}})})();</script></body></html>
